services:
  wledashboard:
    build:
      context: ..
      dockerfile: apps/docker/Dockerfile
    container_name: wledashboard
    restart: unless-stopped
    ports:
      - "8301:8301"
    volumes:
      - wledashboard_data:/data
    environment:
      - NODE_ENV=production
      - PORT=8301
      - HOST=0.0.0.0
      - DATA_DIR=/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8301/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  wledashboard_data:
    driver: local

# ==============================================================================
# OPTIONAL ADVANCED CONFIGURATIONS (For power users)
# ==============================================================================
#
# 1. PRESERVE OLD PORT 3001 BOOKMARKS:
#    If upgrading from pre-v0.21.0 and you want to keep your existing browser
#    bookmarks or dashboard links on port 3001, change ports above to:
#      ports:
#        - "3001:8301"
#
# 2. AUTOMATIC UPDATES (WATCHTOWER):
#    If you use Watchtower (https://containrrr.dev/watchtower/) to automatically
#    update containers, add this label under the wledashboard service:
#      labels:
#        - "com.centurylinklabs.watchtower.enable=true"
#
# 3. LINUX HOST NETWORKING (NATIVE mDNS DISCOVERY):
#    On bare-metal Linux or Proxmox LXC hosts, if you want native mDNS multicast
#    discovery without entering IP addresses, replace the 'ports:' section with:
#      network_mode: host
#    (Note: Do not use host mode on Docker Desktop for macOS or Windows)
# ==============================================================================
